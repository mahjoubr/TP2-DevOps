name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
                    pip install --only-binary :all: -r requirements.txt
          pip install --only-binary :all: pytest pytest-cov flake8 httpx

      - name: Lint
        run: flake8 app.py --max-line-length=120

      - name: Unit tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-fail-under=85

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=mahjoubr
            -Dsonar.projectKey=mahjoubr_TP2-DevOps
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true
